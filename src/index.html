<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M3 13L13 3' stroke='%233b6ea8' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Linkage Lab: automatic Lagrangian mechanics</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="hint"></div>

    <nav id="toolbar">
      <section class="block panel" id="blk-main">
        <div class="brand">Linkage Lab</div>
        <div class="group row">
          <button id="play" class="primary" title="Play / pause (Space)">Play</button>
          <button id="step" title="Advance one frame">Step</button>
          <button id="reset" title="Stop and return to editing (R)">Reset</button>
        </div>
        <div class="group row">
          <button id="undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
          <button id="fit" title="Fit the mechanism in view">Fit view</button>
          <button id="clear" title="Delete everything">Clear</button>
        </div>
        <div class="group row">
          <button id="gallery-btn" title="Your projects saved in this browser, and the example mechanisms">Gallery…</button>
        </div>
      </section>
      <section class="block panel collapsible collapsed" data-block="file">
        <button class="block-head" type="button" aria-expanded="false"><span class="block-title">Save &amp; load</span><span class="block-sum"></span><span class="chev" aria-hidden="true"></span></button>
        <div class="block-body">
          <div class="group file-group">
            <span class="file-title" title="The drawing: bars, joints, gears, springs, joins, the ground">Design</span>
            <div class="row">
              <button id="save-design" title="Save the drawing as a design file">Save</button>
              <button id="load-design" title="Open a design (or a project's design) in place of the drawing">Load</button>
              <button id="import-design" title="Add a design (or a project's design) to the drawing: its outline follows the mouse, click to place it">Import</button>
            </div>
            <span class="file-title" title="The drawing and every setting: gravity, drag, speed, friction, beam colouring, deflection, breaking, the view">Project</span>
            <div class="row">
              <button id="save-project" title="Save the drawing with every setting and the view (Ctrl/Cmd+S)">Save</button>
              <button id="load-project" title="Open a project: its drawing, settings and view">Load</button>
            </div>
            <p class="file-note">Load and Import design also open projects, taking just their drawing.</p>
          </div>
        </div>
      </section>
      <section class="block panel collapsible collapsed" data-block="tools">
        <button class="block-head" type="button" aria-expanded="false"><span class="block-title">Tools</span><span class="block-sum" id="sum-tools"></span><span class="chev" aria-hidden="true"></span></button>
        <div class="block-body">
          <div class="group" id="tools">
            <button data-tool="select" title="Select and move joints (V)">
              <svg viewBox="0 0 16 16"><path d="M3 2l9 5.5-4 1 2.5 4.5-1.8 1-2.5-4.5L3 12z" /></svg>Select<kbd>V</kbd>
            </button>
            <button data-tool="initial" title="Set the initial state: click a part, pick a coordinate or rate, move the mouse, click to settle (I)">
              <svg viewBox="0 0 16 16"><circle cx="5" cy="11" r="2.2" /><path d="M5 11 12.5 3.5M12.5 3.5H8.5M12.5 3.5v4" class="s" style="stroke-width:1.5" /></svg>Initial state<kbd>I</kbd>
            </button>
            <button data-tool="dimension" title="Show a part's dimension: a bar's length, a gear's radius, a joint's position; click again to hide it (U)">
              <svg viewBox="0 0 16 16"><path d="M2 5v6M14 5v6M2 8h12" class="s" /><path d="M4.5 6.2 2.6 8l1.9 1.8M11.5 6.2 13.4 8l-1.9 1.8" class="s" /></svg>Dimension<kbd>U</kbd>
            </button>
            <button data-tool="bar" title="Draw a bar (B)">
              <svg viewBox="0 0 16 16"><path d="M3.5 12.5l9-9" class="s" /><circle cx="3.5" cy="12.5" r="2" /><circle cx="12.5" cy="3.5" r="2" /></svg>Draw bar<kbd>B</kbd>
            </button>
            <button data-tool="rack" title="Draw a rack: a toothed bar that meshes with gears (K)">
              <svg viewBox="0 0 16 16"><path d="M1 11h14v3H1z" /><path d="M2 11V8.6h1.6V11M5.2 11V8.6h1.6V11M8.4 11V8.6H10V11M11.6 11V8.6h1.6V11" /><circle cx="8" cy="4.5" r="3" class="s" /></svg>Draw rack<kbd>K</kbd>
            </button>
            <button data-tool="spring" title="Draw a spring (S)">
              <svg viewBox="0 0 16 16"><path d="M1 8h2.2l1.4-4 1.8 8 1.8-8 1.8 8 1.8-8 1.4 4H15" class="s" /></svg>Draw spring<kbd>S</kbd>
            </button>
            <button data-tool="gear" title="Draw a gear: click a centre, drag the radius (G)">
              <svg viewBox="0 0 16 16"><circle cx="5.5" cy="8" r="3.2" class="s" /><circle cx="11.5" cy="8" r="2.4" class="s" /><circle cx="5.5" cy="8" r="0.9" /><circle cx="11.5" cy="8" r="0.8" /></svg>Gears<kbd>G</kbd>
            </button>
            <button data-tool="wheel" title="Draw a wheel: a toothless disk that rolls on the ground; click a centre, drag the radius (W)">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.6" class="s" style="stroke-width:2.2" /><circle cx="8" cy="8" r="1.3" /><path d="M8 3.6V6.7M8 9.3v3.1M3.6 8h3.1M9.3 8h3.1" class="s" /></svg>Wheel<kbd>W</kbd>
            </button>
            <button data-tool="propeller" title="Draw a propeller: click its centre, then the edge of a blade (P)">
              <svg viewBox="0 0 16 16"><path d="M8 8 2.2 6.4c-.9-.2-.9 1.6 0 1.4L8 8l5.8.2c.9.2.9-1.6 0-1.4Z" /><path d="M8 8v5" class="s" style="stroke-width:1.6" /><path d="M8 2.2v3.4" class="s" /><path d="M6.6 3.6 8 2.2l1.4 1.4" class="s" /></svg>Propeller<kbd>P</kbd>
            </button>
            <button data-tool="pin" title="Pin a joint: click the joint, then a bar, rack or gear to pin it on, or empty space for the ground (F)">
              <svg viewBox="0 0 16 16"><path d="M8 3l4.5 7h-9z" /><path d="M2 12.5h12" class="s" /></svg>Pin<kbd>F</kbd>
            </button>
            <button data-tool="slider" title="Put a joint on a rail: click the joint, then the body the rail is on (or empty space for the ground), then its direction (X)">
              <svg viewBox="0 0 16 16"><path d="M1.5 12.5l13-9" class="s d" /><rect x="5" y="5" width="6" height="6" rx="1" transform="rotate(-35 8 8)" /></svg>Slider<kbd>X</kbd>
            </button>
            <button data-tool="free" title="Make a joint free (N)">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="3.5" class="s" /></svg>Free joint<kbd>N</kbd>
            </button>
            <button data-tool="mass" title="Hang a mass on a joint, or place a free mass (M)">
              <svg viewBox="0 0 16 16"><path d="M8 1.5v4" class="s" /><circle cx="8" cy="10" r="4" /></svg>Mass<kbd>M</kbd>
            </button>
            <button data-tool="lockGear" title="Lock a gear so it cannot turn (L)">
              <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" class="s d" /><rect x="5.2" y="7.4" width="5.6" height="4.4" rx="0.8" /><path d="M6.4 7.4V6a1.6 1.6 0 0 1 3.2 0v1.4" class="s" /></svg>Lock gear<kbd>L</kbd>
            </button>
            <button data-tool="motor" title="Put a motor on a gear, turning it with a steady torque (O)">
              <svg viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5" class="s" /><path d="M8 0.6l3 1.9-3 1.9z" /><circle cx="8" cy="8" r="2.2" /></svg>Motor<kbd>O</kbd>
            </button>
            <button data-tool="lever" title="Give a motor a control lever, worked from the dock at the bottom right (E)">
              <svg viewBox="0 0 16 16"><path d="M4 14h8" class="s" style="stroke-width:2" /><path d="M8 13.5 10.8 4.2" class="s" style="stroke-width:1.6" /><circle cx="11" cy="3.6" r="2.1" /></svg>Lever<kbd>E</kbd>
            </button>
            <button data-tool="pid" title="Put a PID controller on a motor, then pick what its sensor measures (C)">
              <svg viewBox="0 0 16 16"><rect x="1.5" y="4" width="13" height="8" rx="2" class="s" /><circle cx="4.3" cy="8" r="1.1" /><path d="M7 10V6h1.6a1.2 1.2 0 0 1 0 2.4H7M11 6v4" class="s" style="stroke-width:1.1" /></svg>PID<kbd>C</kbd>
            </button>
            <button data-tool="join" title="Join two bodies (bars, racks, gears) into one rigid body (J)">
              <svg viewBox="0 0 16 16"><path d="M2 11.5l5-5" class="s" /><circle cx="11" cy="7" r="3.6" class="s" /><path d="M6 6h4v4H6z" /></svg>Join bodies<kbd>J</kbd>
            </button>
            <button data-tool="delete" title="Delete a joint or bar (D)">
              <svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" class="s" /></svg>Delete<kbd>D</kbd>
            </button>
          </div>
        </div>
      </section>
      <section class="block panel collapsible collapsed" data-block="sim">
        <button class="block-head" type="button" aria-expanded="false"><span class="block-title">Simulation</span><span class="block-sum"></span><span class="chev" aria-hidden="true"></span></button>
        <div class="block-body">
          <div class="group settings">
            <label class="check"><input type="checkbox" id="gravity" checked /> Gravity (9.81 m/s²)</label>
            <label class="slider">Air drag <output id="damping-out"></output><input type="range" id="damping" min="0" max="2" step="0.05" value="0" /></label>
            <label class="slider">Pull stiffness <output id="stiffness-out"></output><input type="range" id="stiffness" min="5" max="400" step="5" value="80" /></label>
            <label class="slider">Speed <output id="speed-out"></output><input type="range" id="speed" min="0.1" max="2" step="0.1" value="1" /></label>
            <label class="pick" title="How the equations of motion are stepped in time">Integrator <select id="integrator"></select></label>
            <label class="pick" title="The time step (for the adaptive integrator: the largest; it takes smaller ones where the motion needs them)"><span id="step-label">Step</span> <select id="step-size"><option value="0.0001">0.1 ms</option><option value="0.0002">0.2 ms</option><option value="0.0005">0.5 ms</option><option value="0.001">1 ms</option><option value="0.002">2 ms</option><option value="0.005">5 ms</option><option value="0.01">10 ms</option><option value="0.02">20 ms</option></select></label>
            <label class="pick" id="tolerance-row" title="The adaptive integrator's error tolerance per sub-step (relative, and absolute for small values)" hidden>Tolerance <select id="tolerance"><option value="0.001">10⁻³</option><option value="0.0001">10⁻⁴</option><option value="0.000001">10⁻⁶</option><option value="1e-8">10⁻⁸</option><option value="1e-10">10⁻¹⁰</option></select></label>
            <p class="int-note" id="integrator-note"></p>
          </div>
        </div>
      </section>
      <section class="block panel collapsible collapsed" data-block="view">
        <button class="block-head" type="button" aria-expanded="false"><span class="block-title">View</span><span class="block-sum"></span><span class="chev" aria-hidden="true"></span></button>
        <div class="block-body">
          <div class="group settings">
            <label class="check"><input type="checkbox" id="labels" checked /> Show labels</label>
            <label class="check" title="The dimensions chosen with the Dimension tool (U). Remembered separately for editing and for running."><input type="checkbox" id="dims" checked /> Show dimensions</label>
            <label class="check" title="While simulating, pan the view to keep the moving parts in the middle"><input type="checkbox" id="follow" /> Follow the mechanism</label>
          </div>
        </div>
      </section>
      <section class="block panel collapsible collapsed" data-block="beams">
        <button class="block-head" type="button" aria-expanded="false"><span class="block-title">Beam forces</span><span class="block-sum" id="sum-beams"></span><span class="chev" aria-hidden="true"></span></button>
        <div class="block-body">
          <div class="group settings" id="beam-colour">
            <span class="seg-title" title="While it runs: colour every bar by an internal force, worked out from the joint forces (inverse dynamics) with each bar's weight, drag and inertia spread along it">Beam forces as colour</span>
            <div class="seg" id="beam-q" role="radiogroup">
              <button data-v="off" class="on" title="No colouring">Off</button>
              <button data-v="V" title="Shear force V">Shear</button>
              <button data-v="N" title="Axial force N: tension (and compression)">Tension</button>
              <button data-v="M" title="Bending moment M">Bending</button>
            </div>
            <div class="seg" id="beam-mode" role="radiogroup" hidden>
              <button data-v="max" class="on" title="Each bar one colour: its largest value, on one scale for all bars (red: the largest any bar has reached in this run)">Maximum</button>
              <button data-v="dist" title="Each bar coloured along its length, on the same scale for all bars">Distribution</button>
            </div>
            <div class="seg" id="beam-scale-mode" role="radiogroup" hidden>
              <button data-v="now" class="on" title="Red is the largest value across all bars right now">Now</button>
              <button data-v="run" title="Red is the largest value any bar has reached in this run (starts again on reset, or another force)">Run peak</button>
              <button data-v="set" title="Red is a value you set (N, or N·m for bending)">Set</button>
            </div>
            <div id="beam-legend" hidden><span class="bl-lo">0</span><span class="bl-bar"></span><span class="bl-hi"></span><input type="number" id="beam-scale" min="0" step="0.01" title="The value drawn red (drag sideways to change it)" hidden /><span class="bl-unit" hidden></span></div>
            <div class="break-row" title="While it runs, draw each bar bent as a beam, EI w″ = M (Euler–Bernoulli), between its joints. The motion stays that of rigid bars. Real deflections are small: they are drawn this many times larger.">
              <label class="check"><input type="checkbox" id="deflect" /> Draw deflection ×</label>
              <input type="number" id="deflect-scale" min="0" step="1" value="100" />
            </div>
            <div class="break-row" id="deflect-ei" title="Young's modulus and second moment of area of every bar that has none of its own (set those in a bar's inspector)">
              <span>E</span><input type="number" id="beam-E" min="0" step="1" value="200" /><span>GPa</span>
              <span>I</span><input type="number" id="beam-I" min="0" step="0.01" value="1" /><span>cm⁴</span>
            </div>
            <div class="break-row" title="While it runs, a bar whose bending moment reaches this snaps there: at the largest |M| in each stretch over it (so a bar may break in several places). The pieces carry on with the motion they had; Reset puts the bars back.">
              <label class="check"><input type="checkbox" id="breakable" /> Bars break at |M| ≥</label>
              <input type="number" id="break-at" min="0" step="0.01" value="2" /><span>N·m</span>
            </div>
          </div>
        </div>
      </section>
      <section class="block panel collapsible collapsed" data-block="physics">
        <button class="block-head" type="button" aria-expanded="false"><span class="block-title">Friction &amp; ground</span><span class="block-sum" id="sum-physics"></span><span class="chev" aria-hidden="true"></span></button>
        <div class="block-body">
          <div class="group settings">
            <label class="check" title="Viscous friction in every pin joint, rail and gear mesh. Dissipated energy heats the joint, which glows and cools by Newton's law."><input type="checkbox" id="friction" /> Friction &amp; heating</label>
            <div id="friction-settings" hidden>
              <label class="slider">Pin joints <output id="fpin-out"></output><input type="range" id="fpin" min="0" max="0.2" step="0.005" value="0.02" /></label>
              <label class="slider">Gear teeth <output id="fmesh-out"></output><input type="range" id="fmesh" min="0" max="5" step="0.1" value="0.5" /></label>
              <label class="slider">Rails <output id="frail-out"></output><input type="range" id="frail" min="0" max="5" step="0.1" value="0.5" /></label>
              <label class="slider">Cooling time τ <output id="fcool-out"></output><input type="range" id="fcool" min="0.5" max="20" step="0.5" value="4" /></label>
            </div>
            <label class="check" title="A ground that joints, bar ends and gear rims cannot pass through. Impacts and sliding lose energy, counted as heat W."><input type="checkbox" id="ground" /> Ground contact</label>
            <div id="ground-settings" hidden>
              <p class="ground-tip">Click the ground to select it, then drag its waypoints up and down. Double-click it to add a waypoint.</p>
              <label class="slider">Restitution <output id="ground-e-out"></output><input type="range" id="ground-e" min="0" max="1" step="0.05" /></label>
              <label class="slider">Friction μ <output id="ground-mu-out"></output><input type="range" id="ground-mu" min="0" max="1.5" step="0.05" /></label>
            </div>
          </div>
        </div>
      </section>
      <section class="block panel collapsible collapsed" data-block="background">
        <button class="block-head" type="button" aria-expanded="false"><span class="block-title">Background</span><span class="block-sum" id="sum-background"></span><span class="chev" aria-hidden="true"></span></button>
        <div class="block-body">
          <div class="group settings">
            <label class="pick" title="A scene behind the drawing, or a custom one with images of your own at distances (saved with the project)">Scene <select id="bg-kind"></select></label>
            <div class="bg-buttons" id="bg-edit-row" hidden>
              <button id="bg-edit" title="Place images over the scene, at distances: the farther, the slower they move as the view pans">Edit background…</button>
            </div>
            <label class="check" id="bg-animate-row" title="The sky turns with the time of day, clouds drift, birds fly, stars twinkle, the weather changes"><input type="checkbox" id="bg-animate" /> Animate</label>
            <label class="slider" id="bg-time-row" title="The time of day (drag to set it; it runs on at the day's length)">Time of day <output id="bg-time-out"></output><input type="range" id="bg-time" min="0" max="24" step="0.05" /></label>
            <label class="pick" id="bg-day-row" title="How long a day takes">A day lasts <select id="bg-day"><option value="60">1 min</option><option value="120">2 min</option><option value="300">5 min</option><option value="600">10 min</option><option value="1800">30 min</option><option value="0">forever (still)</option></select></label>
            <label class="check" id="bg-birds-row" title="A flock of birds flying by day, steered by the boids rules"><input type="checkbox" id="bg-birds" /> Birds</label>
            <label class="pick" id="bg-weather-row" title="Clear, cloudy, rain, storm, thunderstorm or hail: one all the time, or changing by itself (clear spells of random length, broken by weather of a random kind for a random time)">Weather <select id="bg-weather"></select></label>
            <label class="check" id="bg-weather-sound-row" title="Hear the rain, the hail, the wind and the thunder (with sound effects on)"><input type="checkbox" id="bg-weather-sound" /> Weather sounds</label>
            <label class="slider" title="How strongly the background shows behind the mechanism">Strength <output id="bg-opacity-out"></output><input type="range" id="bg-opacity" min="0.1" max="1" step="0.05" value="0.7" /></label>
          </div>
        </div>
      </section>
      <section class="block panel collapsible collapsed" data-block="sound">
        <button class="block-head" type="button" aria-expanded="false"><span class="block-title">Sound</span><span class="block-sum"></span><span class="chev" aria-hidden="true"></span></button>
        <div class="block-body">
          <div class="group settings">
            <label class="check" title="Sound effects for editing and for the running machines (motors, propellers, gears, impacts, rolling…)"><input type="checkbox" id="sound" checked /> Sound effects</label>
            <label class="slider" id="volume-row">Volume <output id="volume-out"></output><input type="range" id="volume" min="0" max="1" step="0.05" value="0.6" /></label>
          </div>
        </div>
      </section>
    </nav>

    <aside id="eom-wrap" class="panel">
      <header>
        <h2>Equations of motion</h2>
        <button id="eom-toggle" title="Collapse">–</button>
      </header>
      <div id="eom"></div>
      <div id="eom-progress" hidden><div class="fill"></div><span class="label"></span></div>
    </aside>

    <div id="inspector" class="panel"></div>
    <div id="levers" class="panel" hidden><div class="lever-scroll"></div></div>
    <div id="status" class="panel"></div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
